name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The package floor is macOS 26.6 (ADR-0002) — the SDK has to be that new to compile at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: swift --version && sw_vers
      - name: Build
        run: swift build
      - name: Test
        # SiriIndexCore only; the tests are hermetic and need no Full Disk Access.
        run: swift test
